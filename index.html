<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Krystal Yang · Visual & UI Designer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f3ee;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      width: min(1100px, 86vw);
    }

    .tag {
      display: inline-block;
      padding: 11px 22px;
      margin-bottom: 32px;
      border-radius: 999px;
      background: linear-gradient(135deg, #a8ff38, #ddff9c);
      font-size: 14px;
      transform: rotate(-4deg);
      box-shadow: 0 10px 30px rgba(168, 255, 56, 0.25);
    }

    h1 {
      margin: 0;
      font-size: clamp(68px, 10vw, 150px);
      line-height: 0.88;
      letter-spacing: -0.07em;
      font-weight: 700;
    }

    .sub {
      margin-top: 30px;
      font-size: 20px;
      color: #77736c;
    }

    .button {
      display: inline-block;
      margin-top: 58px;
      padding: 20px 34px;
      border-radius: 999px;

      background: #111111;
      color: #ffffff;

      font-size: 17px;
      text-decoration: none;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      opacity: 0.82;
    }

    .footer {
      margin-top: 82px;
      font-size: 13px;
      color: #aaa69e;
      letter-spacing: 0.04em;
    }

    @media (max-width: 600px) {
      .wrap {
        width: 86vw;
      }

      h1 {
        font-size: 21vw;
      }

      .sub {
        font-size: 16px;
      }

      .button {
        margin-top: 42px;
        padding: 18px 28px;
      }

      .footer {
        margin-top: 60px;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <div class="tag">
      VISUAL × UI × GROWTH
    </div>

    <h1>
      KRYSTAL<br>
      YANG.
    </h1>

    <div class="sub">
      Visual & UI Designer · Portfolio 2026
    </div>

    <a
      class="button"
      href="https://github.com/xiaoyanyang1121-ai/portfolio/releases/download/v1.0/_.UI._.pdf"
      target="_blank"
      rel="noopener noreferrer"
    >
      VIEW PORTFOLIO ↗
    </a>

    <div class="footer">
      SELECTED WORKS · 2026
    </div>

  </main>

</body>
</html>
